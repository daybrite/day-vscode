# CI + release + (gated) Marketplace publication for the Day VS Code extension.
#
# Structure follows microsoft/vscode-platform-specific-sample (build → artifact → publish-on-tag);
# this extension is pure JS, so the sample's 9-target matrix collapses to one universal .vsix —
# if we ever bundle per-platform helper binaries, reintroduce the matrix here and package with
# `vsce package --target <target>` per entry.
#
# Every push/PR validates PUBLISHABILITY (strict `vsce package` — the same manifest validation
# the Marketplace runs — plus a checklist of the documented requirements). Pushing a `v*` tag
# attaches the .vsix to a GitHub Release (today's distribution channel; the website's install
# instructions curl it). ACTUAL Marketplace/Open VSX publication is fully wired but OFF until
# you flip the repository variables below — the release cycle is independent of day-cli's.
#
# ── Turning publication on ───────────────────────────────────────────────────────────────────
# Marketplace auth is TOKENLESS. Azure DevOps global PATs retire **December 1, 2026** (stated in
# code.visualstudio.com/api/working-with-extensions/publishing-extension), and the same page now
# recommends Entra ID auth outright: "We recommend that extension publishing use Microsoft Entra
# ID-based authentication with workload identity federation and managed identities." That is Entra
# ID workload-identity federation
# per the "secure automated publishing" section of the VS Code publishing docs, adapted to
# GitHub Actions OIDC (the doc's own YAML targets Azure Pipelines; azure/login is the GitHub
# equivalent). One-time setup:
#
#   1. Azure: create a USER-ASSIGNED MANAGED IDENTITY (any subscription/resource group; give it
#      the Reader role on the subscription). Record its Client ID, Tenant ID, Subscription ID.
#   2. On that identity, add a FEDERATED CREDENTIAL for GitHub Actions:
#        issuer   https://token.actions.githubusercontent.com
#        subject  repo:daybrite/day-vscode:environment:marketplace   (matches this job's
#                 `environment:`; tighten/loosen as desired)
#        audience api://AzureADTokenExchange
#   3. Marketplace: at https://marketplace.visualstudio.com/manage, add the identity (by its
#      resource ID) as a MEMBER of the `daybrite` publisher with the Contributor role.
#   4. Repo Settings → Secrets and variables → Actions → VARIABLES (none of these are secrets —
#      OIDC federation means there is nothing to leak):
#        MARKETPLACE_PUBLISH   = true
#        AZURE_CLIENT_ID       = <identity client id>
#        AZURE_TENANT_ID       = <tenant id>
#        AZURE_SUBSCRIPTION_ID = <subscription id>
#      AZURE_SUBSCRIPTION_ID is OPTIONAL — publishing authenticates against the Azure DevOps
#      resource, not a subscription (the login passes `allow-no-subscriptions`).
#      Open VSX (optional; unaffected by the Microsoft PAT retirement — it has its own tokens):
#        OPENVSX_PUBLISH = true   + secret OVSX_PAT (namespace `daybrite` at open-vsx.org).
#        Open VSX additionally requires an eclipse.org account and a signed Eclipse Foundation
#        Publisher Agreement, plus `ovsx create-namespace daybrite` once.
#
# Note on `vsce publish --oidc`: a true trusted-publishing path (no Azure at all) exists in the
# vsce source but is NOT in the released npm `latest`, and is hidden from `--help` as
# unannounced. Worth revisiting before December; not something to wait on.
#
# First flight without a tag: Actions → ci → "Run workflow" with dry-run = true exercises the
# whole publish path (OIDC login + federation verification included) without uploading.

name: ci

on:
  push:
    branches: [main]
    # Semantic versions only, like the day repository. A stray `v-experiment` tag should not
    # reach the Marketplace, where a published version can never be replaced.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  # The e2e legs install the day CLI from day's main branch and a pinned VS Code; neither pushes
  # here, so a weekly run is what notices when either moves out from under the extension.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry-run-publish:
        description: "Exercise the publish job without uploading (verifies OIDC federation + package)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── Build + publishability validation (every push/PR) ──────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - name: Typecheck
        run: npx tsc -p ./ --noEmit
      - name: Bundle
        run: npm run bundle

      # Pre-release channel convention (see PLAN.md): odd minor = pre-release train. The
      # Marketplace has no semver pre-release tags, so the flag must ride the publish command.
      - name: Version / channel
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MINOR=$(node -p "require('./package.json').version.split('.')[1]")
          PRERELEASE=$([ $((MINOR % 2)) -eq 1 ] && echo true || echo false)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "▸ $VERSION (pre-release channel: $PRERELEASE)"

      # THE publishability gate: `vsce package` runs the same manifest validation `vsce publish`
      # does (publisher, engines, icon format, activation events, …) with NO --allow-* escapes,
      # and fails the build on anything the Marketplace would reject.
      - name: Validate publishability (vsce package, strict)
        run: npx @vscode/vsce package -o day-vscode.vsix

      - name: Validate publishability (Marketplace checklist)
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const fail = (m) => { console.error("✗ " + m); process.exitCode = 1; };
          const ok = (m) => console.log("✓ " + m);
          // Requirements per code.visualstudio.com/api/working-with-extensions/publishing-extension
          pkg.publisher ? ok(`publisher: ${pkg.publisher}`) : fail("publisher missing");
          pkg.engines?.vscode ? ok(`engines.vscode: ${pkg.engines.vscode}`) : fail("engines.vscode missing");
          pkg.repository?.url ? ok(`repository: ${pkg.repository.url}`) : fail("repository missing (relative README links won't resolve)");
          if (!pkg.icon) fail("icon missing");
          else if (pkg.icon.endsWith(".svg")) fail("icon must not be SVG");
          else if (!fs.existsSync(pkg.icon)) fail(`icon file ${pkg.icon} missing`);
          else ok(`icon: ${pkg.icon}`);
          (pkg.keywords ?? []).length <= 30 ? ok(`keywords: ${(pkg.keywords ?? []).length}/30`) : fail("more than 30 keywords");
          for (const f of ["README.md", "LICENSE", "CHANGELOG.md"]) {
            fs.existsSync(f) ? ok(f) : fail(`${f} missing`);
          }
          EOF

      - name: List packaged contents
        run: npx @vscode/vsce ls

      - uses: actions/upload-artifact@v7
        with:
          name: day-vscode.vsix
          path: day-vscode.vsix
          if-no-files-found: error

  # ── End to end on every desktop host (push to main / dispatch / weekly) ────────────────────
  # Installs the .vsix this run packaged into a real VS Code, opens a project `day new app`
  # scaffolded on the runner, and drives the extension the way a user does: tick the host's own
  # combo, hit Run, watch the app build and launch. Each leg photographs its own platform, and
  # the screenshots are the artifact — CI evidence first, README and Marketplace images second.
  #
  # Not on pull requests. A leg is 15–30 minutes (a cargo build of the Day framework from git
  # dominates it) and UI automation flakes; neither belongs in front of a merge. `build` above
  # stays the PR gate.
  #
  # Prerequisites per host mirror the day repository's own combo jobs (day/.github/workflows/
  # ci.yml): macOS and Windows need nothing beyond Rust, Linux needs the GTK 4 development
  # libraries. The whole Linux leg runs under one xvfb, which is what puts VS Code and the app
  # it launches on the same display — `day launch` skips its own xvfb wrapper when DISPLAY is
  # already set, so the app renders where the screenshot can see it.
  e2e:
    name: e2e ${{ matrix.combo }}
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ${{ matrix.os }}
    # The default is 360 minutes. A UI run that stops answering would sit there for six hours,
    # and macOS bills at ten times the rate — one wedged `screencapture` cost 2h22m of macos-26
    # before anyone noticed. The harness has its own watchdog (DAY_E2E_WATCHDOG_MS); this is the
    # backstop for the case where the watchdog is what breaks.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, combo: macos-appkit }
          - { os: ubuntu-24.04, combo: linux-gtk }
          - { os: windows-latest, combo: windows-xaml }
    env:
      DAY_E2E_COMBO: ${{ matrix.combo }}
      # Inside the workspace, so the rust-cache entry below can restore the fixture's target/.
      DAY_E2E_FIXTURE_PARENT: ${{ github.workspace }}/e2e-fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Not Swatinem/rust-cache: `day build` points CARGO_TARGET_DIR at
      # `<project>/build/day/cargo/<target>/<profile>`, so a cache watching `target/` would store
      # an empty directory. Cache that path directly, plus the registry and the git checkout of
      # the day repository the fixture depends on.
      #
      # The key carries the run id and restores by prefix, so every run writes a fresh entry and
      # picks up the newest previous one. A fixed key would be worse than useless: a cache entry
      # is immutable, so an exact hit never re-saves and the cache freezes at whatever the first
      # run happened to produce.
      - name: Cache the fixture's Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            e2e-fixture/day-fixture/build/day/cargo
          key: day-fixture-${{ runner.os }}-${{ matrix.combo }}-${{ github.run_id }}
          restore-keys: |
            day-fixture-${{ runner.os }}-${{ matrix.combo }}-

      - name: Install the GTK 4 toolchain (linux-gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Same set the day repository's linux-gtk leg installs. imagemagick supplies `import`,
          # which is how a whole-desktop screenshot is taken under X.
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev pkg-config \
            xvfb imagemagick fonts-noto-cjk

      - name: Install the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          # main, not latest: the CLI is not on crates.io yet (day DESIGN.md §1), so a release
          # install has nothing to fetch.
          version: main

      - run: npm ci
      - name: Bundle + compile
        # The integration host loads package.json `main` (dist/extension.js), so the bundle has to
        # exist even though the suite itself compiles to out/.
        run: |
          npm run bundle
          npm run compile
      - uses: actions/download-artifact@v8
        with:
          name: day-vscode.vsix

      # Fast half: a real extension host, no UI automation. Fails the leg on its own.
      - name: Integration suite (${{ matrix.combo }})
        shell: bash
        run: |
          set -euo pipefail
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          run node test/run-integration.mjs

      # Slow half: install the packaged extension, drive it, build and run the app, photograph it.
      - name: Drive the extension and capture (${{ matrix.combo }})
        shell: bash
        env:
          DAY_E2E_BUILD_TIMEOUT_MS: "1800000"
        run: |
          set -euo pipefail
          # A screen big enough for the editor and the app window side by side; the Linux leg has
          # no display of its own, and this is the one both processes share.
          run() {
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a --server-args="-screen 0 1920x1200x24" "$@"
            else
              "$@"
            fi
          }
          run node test/e2e/drive.mjs --vsix day-vscode.vsix

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.combo }}
          path: build/screenshots/
          if-no-files-found: warn

  # ── Documentation site → https://vscode.daybrite.dev ──────────────────────────────────────
  # Builds on every event so a broken site fails the PR that broke it; deploys only from main.
  #
  # The gallery's images come from the `screenshots-<combo>` artifacts the e2e job uploads. It
  # reads them from the REPOSITORY's artifact list rather than from this run, newest first, which
  # gets the right answer in all three cases: a run that just captured them (its uploads are the
  # newest entries), a docs-only push with e2e skipped (the previous run's captures), and a run
  # where one leg failed (that platform keeps its last good set instead of vanishing).
  website:
    name: website
    needs: [build, e2e]
    # `!cancelled()` rather than `success()`: e2e is skipped on pull requests and may fail on one
    # host, and neither should stop the documentation from building.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # list and download artifacts from earlier runs
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: day-vscode-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Fetch the newest screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p website/screenshot-artifacts
          # Newest first; `sort -u -k1,1` keeps the first row per artifact name, i.e. the latest
          # capture set for each platform. An expired artifact is skipped rather than 404ing.
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("screenshots-")) | select(.expired == false) | "\(.name) \(.id)"' \
            | sort -u -k1,1 > artifacts.txt || true
          if [ ! -s artifacts.txt ]; then
            echo "::notice::no screenshot artifacts available — the gallery will say so"
            exit 0
          fi
          while read -r name id; do
            echo "▸ $name (#$id)"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$name.zip"
            unzip -q -o "$name.zip" -d "website/screenshot-artifacts/$name"
            rm "$name.zip"
          done < artifacts.txt
          find website/screenshot-artifacts -name '*.png' | wc -l | xargs echo "captures:"

      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Upload the Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        id: deploy
        uses: actions/deploy-pages@v5

  # ── GitHub Release (tags): today's install channel ─────────────────────────────────────────
  # The website's Getting Started curls .../releases/latest/download/day-vscode.vsix — keep the
  # asset name STABLE.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: day-vscode.vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: day-vscode.vsix
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}

  # ── Marketplace + Open VSX publication (tags; OFF until the repo variables flip) ───────────
  # Tokenless Marketplace auth: GitHub OIDC → Entra workload-identity federation → the managed
  # identity that is a Contributor on the `daybrite` publisher → `vsce publish
  # --azure-credential` (vsce ≥ 2.26.1 picks the credential up from the azure/login session).
  publish:
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && vars.MARKETPLACE_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry-run-publish)
    needs: [build]
    runs-on: ubuntu-latest
    environment: marketplace   # the federated credential's subject names this environment
    permissions:
      contents: read
      id-token: write          # mint the GitHub OIDC token azure/login exchanges — no secrets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: day-vscode.vsix
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Fail fast with a clear message before attempting the OIDC exchange.
      # A tag that disagrees with package.json publishes the wrong version under the right name,
      # and the Marketplace will not let you replace a published version — so check before the
      # upload, not after. The `build` job already computed the manifest version.
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="${{ needs.build.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "▸ publishing $PKG (pre-release: ${{ needs.build.outputs.prerelease }})"

      # Only the client and tenant are required. Publishing talks to the Azure DevOps resource,
      # not to a subscription, so an Entra tenant with the federated identity is enough — see
      # `allow-no-subscriptions` below. Set AZURE_SUBSCRIPTION_ID only if you have one to scope to.
      - name: Check federation configuration
        run: |
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::repository variable $v is not set (see the workflow header for the Entra federation setup)"; exit 1
            fi
          done
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

      # `vsce --azure-credential` is a plain @azure/identity ChainedTokenCredential; the
      # AzureCliCredential link picks up the session azure/login leaves behind, and asks for a
      # token scoped to the Azure DevOps resource. Microsoft documents this flow for Azure
      # Pipelines only, but the same two steps are what github/vscode-codeql publishes with.
      - name: Azure login (OIDC workload-identity federation)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # Empty when unset, which is fine alongside allow-no-subscriptions.
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      # The dry-run stops here: a successful login proves the federated credential, subject,
      # and identity are all wired correctly — the only parts that can't be checked locally.
      - name: Verify federated identity (dry run stops after this)
        # `az account show` has nothing to show without a subscription; the signed-in identity is
        # what this step exists to prove.
        run: az ad signed-in-user show --output table 2>/dev/null || az account show --output table

      - name: Publish to the Visual Studio Marketplace (vsce --azure-credential)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run-publish) }}
        run: |
          FLAGS=""
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then FLAGS="--pre-release"; fi
          npx @vscode/vsce@latest publish --azure-credential --packagePath day-vscode.vsix $FLAGS

      # Open VSX keeps its own token scheme (unaffected by the Microsoft PAT retirement).
      - name: Publish to Open VSX
        if: ${{ vars.OPENVSX_PUBLISH == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry-run-publish) }}
        run: |
          FLAGS=""
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then FLAGS="--pre-release"; fi
          npx ovsx publish day-vscode.vsix -p "$OVSX_PAT" $FLAGS
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
